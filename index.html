<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ГРОЗА · Краш · Флип · Арена</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10; --panel:#14171C; --panel2:#1B2028; --line:#242B35;
  --tx:#E9EDF2; --tx2:#8B93A1; --tx3:#525A66;
  --amber:#F5B841; --amber-d:#B58520; --win:#31D07E; --lose:#F0545C;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:'Golos Text',sans-serif; font-size:15px;
  overscroll-behavior:none; touch-action:manipulation;
}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;color:var(--tx)}
svg{display:block}

/* ── шапка ─────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(11,13,16,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{color:var(--amber)}
.logo b{font-family:'Unbounded';font-weight:900;font-size:17px;letter-spacing:.06em}
.wallet{display:flex;align-items:center;gap:8px}
.balance{
  display:flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-weight:700;font-variant-numeric:tabular-nums;
}
.balance svg{color:var(--amber)}
.icon-btn{
  width:38px;height:38px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{color:var(--amber)}

/* ── контент ───────────────────────────────── */
main{flex:1;padding:12px 12px 96px}
.view{display:none}
.view.active{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* ── история краша ─────────────────────────── */
.history{display:flex;gap:6px;overflow:hidden;padding:2px 0}
.chip{
  flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;
  font-variant-numeric:tabular-nums;background:var(--panel2);color:var(--tx2);
}
.chip.low{color:var(--lose);background:rgba(240,84,92,.10)}
.chip.high{color:var(--win);background:rgba(49,208,126,.10)}

/* ── график краша ──────────────────────────── */
.graph-wrap{position:relative;height:300px;overflow:hidden}
.graph-wrap.shake{animation:shake .4s}
@keyframes shake{
  20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}
  60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}
}
#crashCanvas{width:100%;height:100%}
.crash-ov{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;pointer-events:none;text-align:center;
}
.ov-title{font-size:12px;letter-spacing:.25em;color:var(--tx2);font-weight:600}
.ov-big{font-family:'Unbounded';font-weight:900;font-size:52px;font-variant-numeric:tabular-nums}
.ov-big.green{color:var(--win)}.ov-big.red{color:var(--lose)}
.ov-sub{font-size:13px;color:var(--tx2)}

/* ── панель ставки ─────────────────────────── */
.betbox{padding:12px;display:flex;flex-direction:column;gap:10px}
.bet-row{display:flex;gap:8px}
.field{
  flex:1;display:flex;flex-direction:column;gap:4px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:8px 12px;
}
.field span{font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.04em}
.field input{
  background:none;border:none;outline:none;font-size:18px;font-weight:700;width:100%;
  font-variant-numeric:tabular-nums;
}
input[type=number]::-webkit-inner-spin-button{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{
  padding:7px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--tx2);
}
.chips button:active{color:var(--amber);border-color:var(--amber-d)}
.auto-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--tx2)}
.auto-row input{
  width:74px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;font-size:14px;font-weight:700;text-align:center;outline:none;
}
.auto-row.off input{opacity:.35}
.switch{position:relative;width:42px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch i{
  position:absolute;inset:0;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);transition:.2s;
}
.switch i:before{
  content:'';position:absolute;width:17px;height:17px;border-radius:50%;
  top:2.5px;left:3px;background:var(--tx3);transition:.2s;
}
.switch input:checked + i{background:rgba(245,184,65,.18);border-color:var(--amber-d)}
.switch input:checked + i:before{left:19px;background:var(--amber)}
.btn-main{
  width:100%;padding:15px;border-radius:13px;font-family:'Unbounded';font-weight:700;
  font-size:14px;letter-spacing:.05em;background:var(--amber);color:#14100a;
  transition:transform .08s;font-variant-numeric:tabular-nums;
}
.btn-main:active{transform:scale(.98)}
.btn-main.win{background:var(--win);color:#04160c}
.btn-main.ghost{background:var(--panel2);color:var(--tx3);pointer-events:none}
.btn-main:disabled{opacity:.55;pointer-events:none}

/* ── список игроков ────────────────────────── */
.players{overflow:hidden}
.players-head{
  display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);
  font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--tx2);
}
.p-row{
  display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
  padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.035);font-size:14px;
}
.p-row:last-child{border-bottom:none}
.p-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.p-row.me{box-shadow:inset 3px 0 0 var(--amber)}
.p-bet{color:var(--tx2);font-variant-numeric:tabular-nums}
.p-mult{min-width:58px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx3)}
.p-row.won .p-mult{color:var(--win)}
.p-row.lost .p-mult{color:var(--lose)}
.p-empty{padding:18px;text-align:center;color:var(--tx3);font-size:13px}

/* ── флип ──────────────────────────────────── */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:12px}
.step{
  text-align:center;font-size:11px;font-weight:700;padding:7px 2px;border-radius:8px;
  background:var(--panel2);color:var(--tx3);font-variant-numeric:tabular-nums;
}
.step.done{background:rgba(245,184,65,.14);color:var(--amber)}
.step.cur{background:var(--amber);color:#14100a;animation:pulse 1.1s infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.coin-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 22px}
.coin-wrap{width:110px;height:110px;perspective:600px}
.coin-wrap.tossing{animation:tossup 2.4s cubic-bezier(.3,.6,.4,1)}
@keyframes tossup{
  0%{transform:translateY(0)}35%{transform:translateY(-85px)}
  70%{transform:translateY(-24px)}100%{transform:translateY(0)}
}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 2.4s cubic-bezier(.2,.65,.3,1)}
.face{
  position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
  background:var(--amber);display:grid;place-items:center;
  box-shadow:inset 0 0 0 6px var(--amber-d), inset 0 0 0 8px rgba(0,0,0,.18);
}
.face.t{transform:rotateY(180deg)}
.face svg{color:#14100a}
#flipMsg{font-size:14px;color:var(--tx2);text-align:center;min-height:20px;padding:0 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{
  padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--tx2);
}
.seg button.active{background:rgba(245,184,65,.15);border-color:var(--amber);color:var(--amber)}
.run-info{
  display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);
  background:var(--panel2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums;
}
.run-btns{display:flex;flex-direction:column;gap:8px}

/* ── арена ─────────────────────────────────── */
.arena-stage{padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:340px;justify-content:center}
.arena-empty{text-align:center;color:var(--tx3);display:flex;flex-direction:column;gap:12px;align-items:center;padding:30px 10px}
.arena-empty svg{color:var(--tx3)}
.arena-empty p{font-size:13.5px;max-width:230px;line-height:1.5}
.wheel-box{position:relative;width:100%;max-width:300px;aspect-ratio:1}
#wheelCanvas{width:100%;height:100%}
.wheel-ov{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;pointer-events:none;text-align:center;
}
.duel-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.duel-p{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.duel-p.lead{border-color:var(--amber)}
.duel-p .n{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel-p .b{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.duel-vs{font-family:'Unbounded';font-size:12px;color:var(--tx3);font-weight:700}
.duel-p2{flex:1;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.duel-p2 input{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;
  font-size:14px;font-weight:700;outline:none;width:100%;font-variant-numeric:tabular-nums;
}
.legend{display:flex;gap:16px;font-size:12px;color:var(--tx2);flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.res-title{font-family:'Unbounded';font-weight:700;font-size:15px}
.res-title.g{color:var(--win)}.res-title.r{color:var(--lose)}
.h-row{
  display:flex;justify-content:space-between;gap:10px;padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.035);font-size:13px;
}
.h-row:last-child{border:none}
.h-who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.h-win{color:var(--win);font-weight:700;font-variant-numeric:tabular-nums}
.h-bank{color:var(--tx);font-variant-numeric:tabular-nums}

/* ── табы ──────────────────────────────────── */
.tabs{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(3,1fr);z-index:30;
  background:rgba(15,17,21,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 10px;color:var(--tx3);font-size:11px;font-weight:600;letter-spacing:.05em}
.tab.active{color:var(--amber)}

/* ── тосты ─────────────────────────────────── */
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(90%,360px)}
.toast{
  background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:10px;padding:11px 14px;font-size:13.5px;animation:tin .25s;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.toast.win{border-left-color:var(--win)}.toast.lose{border-left-color:var(--lose)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ── гостевой вход ─────────────────────────── */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#gate.show{display:flex}
.gate-card{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate-card .logo{justify-content:center}
.gate-card p{color:var(--tx2);font-size:14px;line-height:1.5}
.gate-card input{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
  font-size:15px;outline:none;text-align:center;
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      <b>ГРОЗА</b>
    </div>
    <div class="wallet">
      <button class="icon-btn" id="bonusBtn" title="Бонус"><i data-lucide="gift"></i></button>
      <div class="balance">
        <span id="balanceVal">0</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M13.2 5.6 7.4 13h4l-1.4 5.4L15.8 11h-4l1.4-5.4z"/></svg>
      </div>
    </div>
  </header>

  <main>
    <!-- ═══ КРАШ ═══ -->
    <section class="view active" id="view-crash">
      <div class="history" id="crashHistory"></div>
      <div class="panel graph-wrap" id="crashGraphWrap">
        <canvas id="crashCanvas"></canvas>
        <div class="crash-ov" id="crashOv"></div>
      </div>
      <div class="betbox panel">
        <div class="bet-row">
          <div class="field"><span>СТАВКА</span><input id="crashBet" type="number" value="1000" min="100"></div>
        </div>
        <div class="chips">
          <button data-amt="100">100</button><button data-amt="500">500</button>
          <button data-amt="1000">1 000</button><button data-amt="5000">5 000</button>
          <button data-op="x2">×2</button><button data-op="half">½</button><button data-op="max">MAX</button>
        </div>
        <div class="auto-row" id="autoRow">
          <label class="switch"><input type="checkbox" id="autoOn" checked><i></i></label>
          <span>Автозабрать на</span>
          <input id="autoVal" type="number" step="0.1" value="2.0" min="1.1">
          <span>x</span>
        </div>
        <button class="btn-main" id="crashBtn">ПОСТАВИТЬ</button>
      </div>
      <div class="panel players">
        <div class="players-head"><span>ИГРОКИ</span><span id="crashBank">0</span></div>
        <div id="crashPlayers"><div class="p-empty">Ставок пока нет</div></div>
      </div>
    </section>

    <!-- ═══ ФЛИП ═══ -->
    <section class="view" id="view-flip">
      <div class="panel">
        <div class="ladder" id="flipLadder"></div>
        <div class="coin-stage">
          <div class="coin-wrap" id="coinWrap">
            <div class="coin" id="coin">
              <div class="face e">
                <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 15c3-6 6-6 9-2 3-4 6-4 9 2"/><path d="M3 19c3-4 6-4 9-1 3-3 6-3 9 1" opacity=".45"/></svg>
              </div>
              <div class="face t">
                <svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="4.6" r="1.1"/><circle cx="12" cy="19.4" r="1.1"/><circle cx="4.6" cy="12" r="1.1"/><circle cx="19.4" cy="12" r="1.1"/><text x="12" y="16.4" text-anchor="middle" font-size="13" font-weight="900" font-family="Unbounded,sans-serif">1</text></svg>
              </div>
            </div>
          </div>
          <div id="flipMsg">Выбери сторону и сделай ставку</div>
        </div>
      </div>
      <div class="betbox panel">
        <div class="seg" id="flipSideSeg">
          <button data-side="e" class="active">ОРЁЛ</button>
          <button data-side="t">РЕШКА</button>
        </div>
        <div id="flipNew">
          <div class="bet-row">
            <div class="field"><span>СТАВКА</span><input id="flipBet" type="number" value="1000" min="100"></div>
          </div>
          <div class="chips">
            <button data-amt="100">100</button><button data-amt="500">500</button>
            <button data-amt="1000">1 000</button><button data-amt="5000">5 000</button>
            <button data-op="x2">×2</button><button data-op="half">½</button><button data-op="max">MAX</button>
          </div>
          <button class="btn-main" id="flipBtn">БРОСИТЬ</button>
        </div>
        <div id="flipRun" style="display:none;flex-direction:column;gap:10px">
          <div class="run-info"><span>Уровень <b id="frLevel">1</b>/10</span><span>След. множитель <b id="frNext">3.8x</b></span></div>
          <div class="run-btns">
            <button class="btn-main win" id="flipCashBtn">ЗАБРАТЬ</button>
            <button class="btn-main" id="flipGoBtn">ПРОДОЛЖИТЬ</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══ АРЕНА ═══ -->
    <section class="view" id="view-arena">
      <div class="panel arena-stage" id="arenaStage"></div>
      <div class="betbox panel" id="arenaCreate">
        <div class="bet-row">
          <div class="field"><span>ТВОЯ СТАВКА</span><input id="arenaBet" type="number" value="1000" min="100"></div>
        </div>
        <div class="chips">
          <button data-amt="100">100</button><button data-amt="500">500</button>
          <button data-amt="1000">1 000</button><button data-amt="5000">5 000</button>
          <button data-op="x2">×2</button><button data-op="half">½</button><button data-op="max">MAX</button>
        </div>
        <button class="btn-main" id="arenaBtn">СОЗДАТЬ АРЕНУ</button>
      </div>
      <div class="panel">
        <div class="players-head"><span>ПОСЛЕДНИЕ ДУЭЛИ</span></div>
        <div id="arenaHistory"><div class="p-empty">Пока пусто</div></div>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-view="crash"><i data-lucide="plane"></i><span>КРАШ</span></button>
    <button class="tab" data-view="flip"><i data-lucide="coins"></i><span>ФЛИП</span></button>
    <button class="tab" data-view="arena"><i data-lucide="swords"></i><span>АРЕНА</span></button>
  </nav>

  <div id="toasts"></div>

  <div id="gate">
    <div class="gate-card">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#F5B841"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        <b>ГРОЗА</b>
      </div>
      <p>Ты открыл сайт не через Telegram — включится гостевой режим для теста. Введи ник:</p>
      <input id="gateName" placeholder="Твой ник" maxlength="16">
      <button class="btn-main" id="gateBtn">ВОЙТИ</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ══════════════ УТИЛИТЫ ══════════════ */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const COIN = '<svg style="display:inline;vertical-align:-2px;margin-left:4px" width="13" height="13" viewBox="0 0 24 24" fill="#F5B841"><circle cx="12" cy="12" r="10" fill="none" stroke="#F5B841" stroke-width="2.4"/><path d="M13.2 5.6 7.4 13h4l-1.4 5.4L15.8 11h-4l1.4-5.4z"/></svg>';
function toast(msg,type=''){
  const d=document.createElement('div');
  d.className='toast '+type; d.textContent=msg;
  $('#toasts').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='.3s';setTimeout(()=>d.remove(),300)},2800);
}
function buzz(type){ try{Telegram.WebApp.HapticFeedback.impactOccurred(type)}catch(e){} }

/* ══════════════ АВТОРИЗАЦИЯ ══════════════ */
const TG = window.Telegram && window.Telegram.WebApp;
let ME = null, AUTH = null;
if (TG && TG.initData) { AUTH = {type:'tg', data:TG.initData}; }
else {
  const g = localStorage.getItem('gz_guest');
  AUTH = g ? {type:'guest', id:+g} : null;
}
async function api(url, body){

const multAt = s => Math.pow(1.0718, s);
const cv = { phase:'idle', startAt:0, endEl:0, endM:1, crashAt:0,
             players:[], myBet:null, cctx:null, cw:0, ch:0 };
const AMBER='#F5B841', WIN='#31D07E', LOSE='#F0545C', GRID='#1E242C';

function resizeCrash(){
  const c = $('#crashCanvas'), dpr = window.devicePixelRatio||1;
  const r = c.parentElement.getBoundingClientRect();
  c.width = r.width*dpr; c.height = r.height*dpr;
  cv.cctx = c.getContext('2d'); cv.cctx.setTransform(dpr,0,0,dpr,0,0);
  cv.cw = r.width; cv.ch = r.height;
}
window.addEventListener('resize', resizeCrash);

function curMult(){
  if(cv.phase==='flying') return multAt((performance.now()-cv.startAt)/1000);
  if(cv.phase==='crashed') return cv.endM;
  return 1;
}
socket.on('crash:state', d=>{
  cv.phase = d.phase; cv.players = d.players||[];
  if(d.phase==='flying') cv.startAt = performance.now();
  if(d.phase==='crashed'){ cv.endM = d.point; cv.crashAt = performance.now(); }
  if(d.my) cv.myBet = {...d.my};
  renderHistory(d.history); renderPlayers();
});
socket.on('crash:phase', d=>{
  if(d.phase==='waiting'){
    cv.phase='waiting'; cv.myBet=null; cv.players=[];
    if(d.history) renderHistory(d.history);
  }
  if(d.phase==='flying'){
    cv.phase='flying'; cv.startAt=performance.now(); cv.players=d.players||[];
    if(cv.myBet && !cv.myBet.cashed) toast('Самолёт взлетел!','#');
  }
  if(d.phase==='crashed'){
    cv.phase='crashed'; cv.endM=d.point; cv.crashAt=performance.now();
    cv.endEl = (performance.now()-cv.startAt)/1000;
    cv.players = d.players||[];
    if(cv.myBet && !cv.myBet.cashed){ buzz('heavy'); toast('Улетел на '+d.point.toFixed(2)+'x — ставка сгорела','lose'); }
    $('#crashGraphWrap').classList.add('shake');
    setTimeout(()=>$('#crashGraphWrap').classList.remove('shake'),450);
  }
  renderPlayers();
});
socket.on('crash:players', p=>{ cv.players=p; renderPlayers(); });
socket.on('crash:cashout', d=>{
  cv.players = d.players;
  if(d.uid===ME.id && cv.myBet){ cv.myBet.cashed = d.mult; buzz('light'); toast('Забрал '+d.mult.toFixed(2)+'x · +'+fmt(d.payout),'win'); }

});

function renderPlayers(){
  const el = $('#crashPlayers');
  let bank = 0;
  if(!cv.players.length){ el.innerHTML='<div class="p-empty">Ставок пока нет</div>'; $('#crashBank').textContent=''; return; }
  el.innerHTML = cv.players.map(p=>{

  }).join('');
  $('#crashBank').textContent = fmt(bank)+COIN;
}

/* отрисовка графика */
function drawCrash(){
  const ctx=cv.cctx; if(!ctx) return;
  const w=cv.cw, h=cv.ch;
  ctx.clearRect(0,0,w,h);
  let el=0, m=1;
  if(cv.phase==='flying'){ el=(performance.now()-cv.startAt)/1000; m=multAt(el); }
  else if(cv.phase==='crashed'){ el=cv.endEl; m=cv.endM; }
  const padL=40, padR=18, padT=16, padB=26;
  const maxM=Math.max(1.9,m*1.15), maxT=Math.max(6,Math.max(el,1)*1.15);
  const X=t=>padL+(t/maxT)*(w-padL-padR), Y=v=>h-padB-(v/maxM)*(h-padT-padB);
  // сетка
  ctx.strokeStyle=GRID; ctx.fillStyle='#525A66';
  ctx.font='10px Golos Text'; ctx.lineWidth=1; ctx.textAlign='right';
  const step=maxM<=2?0.5:maxM<=5?1:maxM<=12?2:maxM<=30?5:maxM<=80?10:25;
  for(let v=step; v<maxM; v+=step){
    ctx.beginPath(); ctx.moveTo(padL,Y(v)); ctx.lineTo(w-padR,Y(v)); ctx.stroke();
    ctx.fillText(v.toFixed(1)+'x', padL-6, Y(v)+3);
  }
  ctx.textAlign='center';
  const tStep=maxT<=8?2:maxT<=20?5:10;
  for(let t=tStep;t<maxT;t+=tStep) ctx.fillText(t+'с', X(t), h-8);
  if(cv.phase==='waiting'){ // отсчёт до старта
    const left=Math.max(0,(cv.startAt+5000-performance.now())/1000);
    ctx.fillStyle=AMBER;
    ctx.fillRect(padL, h-3, (w-padL-padR)*(left/5), 3);
    return;
  }
  // заливка под кривой
  ctx.beginPath(); ctx.moveTo(X(0),Y(1));
  const N=64;
  for(let i=1;i<=N;i++){ const t=el*i/N; ctx.lineTo(X(t),Y(multAt(t))); }
  ctx.lineTo(X(el),h-padB); ctx.lineTo(X(0),h-padB); ctx.closePath();
  ctx.fillStyle='rgba(245,184,65,.06)'; ctx.fill();
  // сама кривая
  ctx.beginPath();
  for(let i=0;i<=N;i++){ const t=el*i/N; const x=X(t),y=Y(multAt(t)); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle=cv.phase==='crashed'?LOSE:AMBER;
  ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  // бумажный самолётик на конце
  const px=X(el), py=Y(m);
  const dx=X(el)-X(Math.max(0,el-.25)), dy=Y(m)-Y(multAt(Math.max(0,el-.25)));
  const ang=Math.atan2(dy,dx);
  let fx=px, fy=py, alpha=1;
  if(cv.phase==='crashed'){ // улетает по инерции
    const p=Math.min(1,(performance.now()-cv.crashAt)/700);
    fx=px+Math.cos(ang)*p*90; fy=py+Math.sin(ang)*p*90; alpha=1-p;
  }
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(fx,fy); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(15,0); ctx.lineTo(-11,-9); ctx.lineTo(-5,0); ctx.lineTo(-11,9); ctx.closePath();
  ctx.fillStyle=AMBER; ctx.fill(); ctx.restore();
}

/* центральный оверлей */
let ovCache='';
function crashOverlay(){
  let html='';
  if(cv.phase==='waiting'){
    const left=Math.max(0,(cv.startAt+5000-performance.now())/1000);
    html=`<div class="ov-title">СТАВКИ ОТКРЫТЫ</div><div class="ov-big">${left.toFixed(1)}</div><div class="ov-sub">самолёт вылетит через мгновение</div>`;
  }else if(cv.phase==='flying'){
    html=`<div class="ov-big green">${curMult().toFixed(2)}x</div>`;
  }else if(cv.phase==='crashed'){
    html=`<div class="ov-title">УЛЕТЕЛ</div><div class="ov-big red">${cv.endM.toFixed(2)}x</div>`;
  }else{
    html=`<div class="ov-title">ПОДКЛЮЧЕНИЕ...</div>`;
  }
  if(html!==ovCache){ ovCache=html; $('#crashOv').innerHTML=html; }
}

const fv = { active:false, bet:0, level:0, side:'e', busy:false, spins:0 };
function ladderRender(){
  $('#flipLadder').innerHTML = FMULTS.map((m,i)=>{
    const cls = fv.active && fv.level>i+0 ? 'done' : fv.active && fv.level===i+1 ? 'cur' : '';

  $('#coin').style.transform=`rotateY(${target}deg)`;

  $('#flipRun').style.display = fv.active?'flex':'none';

    $('#frLevel').textContent=fv.level;
    $('#frNext').textContent=(fv.level<10?FMULTS[fv.level]:'MAX')+'x';
    const pot=Math.round(fv.bet*FMULTS[fv.level-1]);
    $('#flipCashBtn').textContent='ЗАБРАТЬ '+fmt(pot);
    $('#flipGoBtn').textContent=fv.level<10?'ПРОДОЛЖИТЬ · '+FMULTS[fv.level]+'x':'МАКСИМУМ';

  if(fv.busy||fv.active) return;

  if(!r.ok){ toast(r.error||r.balance?'':'Ошибка','lose'); if(r.error)toast(r.error,'lose'); return; }
  $('#flipMsg').textContent='Монета в воздухе...';
  const resSide = r.win?fv.side:(fv.side==='e'?'t':'e');

    if(!r.win){ $('#flipMsg').textContent='Не угадал. Ставка сгорела.'; toast('−'+fmt(r.bet||0),'lose'); }

      fv.active=true; fv.bet=r.bet??0; fv.level=r.level; 
      $('#flipMsg').textContent='Угадал! Теперь можно забрать или рискнуть дальше.';

 $('#flipGoBtn').onclick = async ()=>{

}
 $('#arenaBtn').onclick=()=>{
  socket.emit('arena:create',{bet:Math.floor(+$('#arenaBet').value||0)},r=>{
    if(!r.ok) toast(r.error,'lose');
  });
};

/* колесо арены */
function drawArena(){
  const c=$('#wheelCanvas'); if(!c||!av||!av.p2) return;
  const dpr=window.devicePixelRatio||1;
  const r=c.getBoundingClientRect();
  if(c.width!==r.width*dpr){ c.width=r.width*dpr; c.height=r.height*dpr; }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=r.width,h=r.height,cx=w/2,cy=h/2,R=Math.min(w,h)/2-14;
  ctx.clearRect(0,0,w,h);
  const frac=wheel.frac, a0=-Math.PI/2;
  // дуги зон
  ctx.lineWidth=24; ctx.lineCap='butt';
  ctx.beginPath(); ctx.arc(cx,cy,R,a0,a0+frac*2*Math.PI); ctx.strokeStyle=AMBER; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,R,a0+frac*2*Math.PI,a0+2*Math.PI); ctx.strokeStyle=LOSE; ctx.stroke();
  // риски-лунки
  ctx.strokeStyle='#0B0D10'; ctx.lineWidth=2;
  for(let i=0;i<24;i++){ const a=a0+i/24*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(R-12),cy+Math.sin(a)*(R-12));
    ctx.lineTo(cx+Math.cos(a)*(R+12),cy+Math.sin(a)*(R+12)); ctx.stroke(); }
  // шарик
  let ballA=0, ballR=R;
  if(av.status==='spin'){
    const t=Math.min(1,(performance.now()-wheel.start)/wheel.dur);
    const e=1-Math.pow(1-t,4); // easeOutQuart
    ballA=e*(4*2*Math.PI+wheel.needle*2*Math.PI);
    ballR=R+12-22*e;
  }else if(av.status==='result'){
    ballA=wheel.needle*2*Math.PI; ballR=R-10;
  }
  const bx=cx+Math.cos(a0+ballA)*ballR, by=cy+Math.sin(a0+ballA)*ballR;
  ctx.beginPath(); ctx.arc(bx,by,7,0,7); ctx.fillStyle='#E9EDF2'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx-2,by-2,2.2,0,7); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
}

/* ══════════════ ГЛАВНЫЙ ЦИКЛ ══════════════ */
let cdStart=0;
socket.on('arena:update', d=>{ if(d&&d.status==='countdown') wheel.cdStart=performance.now(); });
function loop(){
  requestAnimationFrame(loop);
  crashOverlay(); crashBtnUI();
  if(activeTab==='crash') drawCrash();
  if(activeTab==='arena') drawArena();
}
window.addEventListener('load',()=>{ resizeCrash(); if(window.lucide)lucide.createIcons(); loop(); });
</script>
