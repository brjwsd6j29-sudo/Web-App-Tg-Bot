<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 Gaming Bot</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="balance-box">
            <span class="balance-icon">💰</span>
            <span class="balance" id="balance">1000</span>
            <span class="balance-label">монет</span>
        </div>
        <div class="user-info" id="user-info"></div>
    </header>

    <!-- Меню игр -->
    <nav class="game-nav">
        <button class="nav-btn active" onclick="switchGame('crash')">
            <span class="nav-icon">✈️</span>
            <span>Краш</span>
        </button>
        <button class="nav-btn" onclick="switchGame('flip')">
            <span class="nav-icon">🪙</span>
            <span>Флип</span>
        </button>
        <button class="nav-btn" onclick="switchGame('arena')">
            <span class="nav-icon">⚔️</span>
            <span>Арена</span>
        </button>
    </nav>

    <!-- Контейнер для игр -->
    <main id="game-container">
        <!-- Игры загружаются сюда -->
    </main>

    <!-- Подключаем скрипты -->
    <script src="script.js"></script>
    <script src="games/crash.js"></script>
    <script src="games/flip.js"></script>
    <script src="games/arena.js"></script>
</body>
</html>
